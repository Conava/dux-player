name: CI

on:
  push:
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch has current quickshell and Qt 6 packages, which lint-qml needs (qs builds the tooling VFS, qmllint reads it).
    container: archlinux:base
    timeout-minutes: 20
    env:
      XDG_RUNTIME_DIR: /tmp/runtime
    steps:
      # Without mpv and ffmpeg the tests that play or measure audio skip; gcc is for
      # the race detector only, the build stays CGO_ENABLED=0.
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman -Syu --noconfirm --needed git make diffutils go gcc nodejs python quickshell qt6-declarative mpv ffmpeg
          useradd --create-home builder
          install -d -m 700 -o builder "$XDG_RUNTIME_DIR"

      - name: Record versions
        run: pacman -Q go gcc quickshell qt6-declarative nodejs mpv ffmpeg

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      # Root ignores file permissions, so everything runs as a normal user, as on a
      # developer's machine; owning the checkout also keeps git from refusing it.
      - name: Hand the checkout to the build user
        run: chown -R builder "$GITHUB_WORKSPACE"

      - name: Lint
        run: runuser -u builder -- make lint

      - name: Test
        run: runuser -u builder -- make test

      - name: Race test
        run: runuser -u builder -- make test-race

      - name: Build
        run: runuser -u builder -- make build
